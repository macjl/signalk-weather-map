<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Map — SignalK</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css" crossorigin=""/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; background: #1a2535; }
    #map { height: 100%; width: 100%; }

    #panel {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.93);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      padding: 12px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      min-width: 220px;
    }
    /* The legend has an independent visibility control. */

    /* Forecast slider */
    #time-display {
      font-size: 14px;
      font-weight: 700;
      color: #1a2535;
      text-align: center;
      margin-bottom: 4px;
      min-height: 20px;
    }
    #time-secondary {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-bottom: 6px;
    }
    input[type=range] {
      width: 100%;
      accent-color: #2566c8;
      cursor: pointer;
      margin-bottom: 10px;
    }

    #grid-info {
      font-size: 11px;
      color: #999;
      flex: 1;
      text-align: right;
    }

    #btn-set-default {
      width: 100%;
      margin-top: 4px;
      padding: 4px;
      font-size: 11px;
      border: 1px solid #f0a020;
      border-radius: 5px;
      background: #fff8ee;
      color: #b07010;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    #btn-set-default:hover { background: #f0a020; color: #fff; }
    #btn-set-default:disabled { opacity: 0.4; cursor: default; }

    #legend {
      position: absolute;
      bottom: 28px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.88);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 11px;
      color: #333;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
      line-height: 1.65;
    }
    #legend b { display: block; margin-bottom: 3px; font-size: 11px; color: #1a2535; }

    #status {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      background: rgba(20,40,80,0.82);
      color: #fff;
      border-radius: 20px;
      padding: 5px 18px;
      font-size: 12px;
      display: none;
      white-space: nowrap;
    }
    #status.error {
      background: rgba(180,20,20,0.92);
      padding: 8px 22px;
      font-size: 13px;
      white-space: normal;
      max-width: 320px;
      text-align: center;
      border-radius: 12px;
    }

    .wind-barb-icon { background: none !important; border: none !important; pointer-events: none; }
    /* MapLibre marks DOM markers behind the globe but does not fully hide
       custom marker elements by default. They must never be visible through
       the planet. */
    .maplibregl-marker-covered { opacity: 0 !important; visibility: hidden !important; }
    .weather-tooltip-hit { width: 34px; height: 34px; background: transparent; cursor: crosshair; }
    .maplibregl-popup-content { font-size: 12px; line-height: 1.5; padding: 8px 10px; }
    #gpu-error { position: absolute; inset: 0; z-index: 2000; display: grid; place-items: center; padding: 24px; background: #1a2535; color: #fff; text-align: center; font-size: 15px; line-height: 1.5; }
    #gpu-error[hidden] { display: none; }
    #gpu-error strong { display: block; margin-bottom: 8px; font-size: 18px; }

    /* Bottom control dock: a compact control row and a full-width timeline. */
    #panel { top: auto; right: 0; bottom: 0; left: 0; min-width: 0; border-radius: 12px 12px 0 0; padding: 8px 12px 9px; box-shadow: 0 -4px 16px rgba(0,0,0,.22); touch-action: manipulation; }
    #panel-header { display: flex; align-items: center; justify-content: flex-start; margin: 0; gap: 8px; min-width: 0; }
    #panel-body { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }
    .source-control { display: flex; align-items: center; gap: 5px; flex: 0 1 260px; min-width: 125px; }
    .source-control label { font-size: 11px; color: #666; flex-shrink: 0; }
    .source-control select { min-width: 0; width: 100%; font-size: 12px; border: 1px solid #c8d0dc; border-radius: 6px; padding: 5px 7px; background: #fff; color: #222; }
    #layer-selector { display: flex; flex-direction: row; align-items: center; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: thin; padding: 1px 9px; margin: 0; flex: 1; border-right: 1px solid #dce2ea; }
    .source-control { padding-right: 8px; border-right: 1px solid #dce2ea; }
    .layer-btn { padding: 5px 8px; font-size: 11px; font-weight: 600; border: 1px solid #d0d0d0; border-radius: 999px; background: #f5f5f5; color: #555; cursor: pointer; letter-spacing: .01em; white-space: nowrap; flex: 0 0 auto; }
    .layer-btn:hover { background: #e8e8e8; }
    .layer-btn.active { background: #1a3a6b; color: #fff; border-color: #1a3a6b; }
    #btn-set-default { width: auto; margin: 0; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
    #btn-provider-info { width: 25px; height: 25px; flex: 0 0 25px; border: 1px solid #aebccc; border-radius: 50%; background: #fff; color: #1a3a6b; font-weight: 800; font-family: Georgia, serif; font-size: 14px; line-height: 1; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #btn-provider-info:hover:not(:disabled) { background: #eaf1fb; }
    #btn-provider-info:disabled { opacity: .4; cursor: default; }

    #time-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .time-step-btn { width: 30px; height: 30px; border: 1px solid #c8d0dc; border-radius: 50%; background: #fff; color: #1a3a6b; font-size: 22px; line-height: 1; cursor: pointer; flex-shrink: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    #btn-time-play { font-size: 14px; font-weight: 800; }
    .time-step-btn:hover:not(:disabled) { background: #eaf1fb; }
    .time-step-btn:disabled { opacity: .35; cursor: default; }
    #time-area { position: relative; min-width: 0; flex: 1; }
    #time-meta { display: grid; grid-template-columns: minmax(72px,1fr) auto minmax(72px,1fr); align-items: center; gap: 10px; margin-bottom: 2px; }
    #time-display { margin: 0; min-height: 0; font-size: 13px; white-space: nowrap; }
    #time-secondary { margin: 0; min-height: 14px; font-size: 10px; }
    .time-bound { color: #617085; font-size: 10px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .time-bound:last-child { text-align: right; }
    #time-slider-wrap { position: relative; height: 27px; }
    #slider-time { position: absolute; top: 9px; left: 0; z-index: 2; margin: 0; }
    #time-ticks { position: absolute; inset: 0 7px; z-index: 3; pointer-events: none; }
    .time-tick { position: absolute; top: 11px; width: 8px; height: 8px; transform: translateX(-50%); border: 1px solid #3d628f; border-radius: 50%; background: #fff; padding: 0; cursor: pointer; pointer-events: auto; }
    .time-tick.day-a { border-color: #2566c8; background: #dceaff; }
    .time-tick.day-b { border-color: #11a0a0; background: #d8f4f1; }
    .time-tick.active { width: 12px; height: 12px; top: 9px; background: #1a3a6b; border-color: #1a3a6b; }
    .time-day { position: absolute; top: -2px; transform: translateX(-50%); color: #52627a; font-size: 9px; font-weight: 700; white-space: nowrap; }
    #legend { top: 10px; right: 10px; bottom: auto; left: auto; width: min(350px, calc(100vw - 20px)); max-width: none; padding: 10px 30px 10px 13px; font-size: 12px; }
    #legend-title { display: block; margin-bottom: 7px; color: #1a3a6b; font-size: 13px; font-weight: 800; letter-spacing: .02em; }
    #legend #grid-info { display: block !important; margin-top: 5px; padding-top: 4px; border-top: 1px solid #dce2ea; color: #617085; font-size: 10px; font-weight: 700; }
    #btn-toggle-legend, #btn-show-legend { border: 0; cursor: pointer; color: #52627a; background: transparent; font-size: 17px; line-height: 1; }
    #btn-toggle-legend { position: absolute; top: 7px; right: 7px; padding: 2px 4px; }
    #btn-toggle-legend:hover, #btn-show-legend:hover { color: #1a3a6b; }
    #btn-show-legend { position: absolute; top: 10px; right: 10px; z-index: 1001; padding: 6px 8px; border-radius: 7px; background: rgba(255,255,255,.9); box-shadow: 0 2px 8px rgba(0,0,0,.18); }
    #status { bottom: 148px; }
    #provider-info-dialog { position: absolute; inset: 0; z-index: 1200; display: grid; place-items: center; padding: 18px; background: rgba(18, 31, 48, .35); }
    #provider-info-dialog[hidden] { display: none; }
    #provider-info-card { position: relative; width: min(430px, 100%); max-height: min(620px, calc(100vh - 36px)); overflow-y: auto; padding: 20px; border-radius: 12px; background: #fff; color: #1a2535; box-shadow: 0 10px 30px rgba(0,0,0,.28); }
    #provider-info-card h2 { margin: 0 28px 14px 0; font-size: 18px; line-height: 1.2; color: #1a3a6b; }
    #btn-close-provider { position: absolute; top: 10px; right: 10px; border: 0; background: transparent; color: #52627a; font-size: 23px; line-height: 1; cursor: pointer; }
    #provider-info-details { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 8px 12px; font-size: 13px; }
    #provider-info-details dt { color: #617085; font-weight: 650; }
    #provider-info-details dd { min-width: 0; margin: 0; color: #1a2535; font-weight: 650; overflow-wrap: anywhere; }
    #provider-layers-note { display: block; margin-top: 5px; color: #617085; font-size: 11px; font-weight: 500; }
    #provider-info-card #btn-set-default { width: 100%; padding: 8px 10px; }
    @media (max-width: 720px) {
      #panel { padding: 7px 8px 8px; }
      .source-control label { display: none !important; }
      .source-control { flex: 0 1 145px; min-width: 105px; }
      #btn-provider-info { width: 24px; height: 24px; flex-basis: 24px; }
      #time-meta { grid-template-columns: minmax(56px,1fr) auto minmax(56px,1fr); gap: 5px; }
      .time-bound { font-size: 9px; }
      #legend { top: 10px; bottom: auto; }
      #btn-show-legend { top: 10px; }
      #status { bottom: 138px; }
    }
  </style>
</head>
<body>
<div id="map"></div>
<div id="gpu-error" role="alert" hidden><div><strong>Carte globe indisponible</strong>Cette visualisation nécessite un navigateur avec WebGL2 et une accélération graphique active.</div></div>

<div id="panel">
  <div id="panel-header">
    <div id="panel-body">
      <div class="source-control">
        <label data-i18n="source"></label>
        <select id="sel-source"></select>
        <button id="btn-provider-info" type="button" aria-label="Provider information" title="Provider information">i</button>
      </div>
    <div id="layer-selector">
      <button class="layer-btn active" data-layer="wind"   data-i18n="layerWind"></button>
      <button class="layer-btn"        data-layer="gust"   data-i18n="layerGust"></button>
      <button class="layer-btn"        data-layer="temp"   data-i18n="layerTemp"></button>
      <button class="layer-btn"        data-layer="waterTemp" data-i18n="layerWaterTemp"></button>
      <button class="layer-btn"        data-layer="cloud"  data-i18n="layerCloud"></button>
      <button class="layer-btn"        data-layer="precip" data-i18n="layerPrecip"></button>
      <button class="layer-btn"        data-layer="press"  data-i18n="layerPress"></button>
      </div>
    </div>
  </div>
  <div id="time-row">
    <button id="btn-time-prev" class="time-step-btn" aria-label="Previous forecast">‹</button>
    <button id="btn-time-play" class="time-step-btn" type="button" aria-label="Play forecast" title="Play forecast">▶</button>
    <button id="btn-time-next" class="time-step-btn" aria-label="Next forecast">›</button>
    <div id="time-area">
      <div id="time-meta">
        <span id="time-start" class="time-bound">—</span>
        <div>
          <div id="time-display">—</div>
          <div id="time-secondary">&nbsp;</div>
        </div>
        <span id="time-end" class="time-bound">—</span>
      </div>
      <div id="time-slider-wrap">
        <input type="range" id="slider-time" min="0" max="0" value="0" disabled>
        <div id="time-ticks" aria-label="Forecast timeline"></div>
      </div>
    </div>
  </div>
</div>

<div id="legend">
  <button id="btn-toggle-legend" aria-label="Hide legend">×</button>
  <span id="legend-title">⚓ Weather Map</span>
  <span id="legend-text"></span>
  <span id="grid-info">—</span>
</div>
<button id="btn-show-legend" aria-label="Show legend" style="display:none">☰</button>

<div id="provider-info-dialog" role="dialog" aria-modal="true" aria-labelledby="provider-info-title" hidden>
  <section id="provider-info-card">
    <button id="btn-close-provider" type="button" aria-label="Close">×</button>
    <h2 id="provider-info-title"></h2>
    <dl id="provider-info-details">
      <dt id="provider-plugin-label"></dt><dd id="provider-plugin"></dd>
      <dt id="provider-status-label"></dt><dd id="provider-status"></dd>
      <dt id="provider-period-label"></dt><dd id="provider-period"></dd>
      <dt id="provider-steps-label"></dt><dd id="provider-steps"></dd>
      <dt id="provider-layers-label"></dt><dd><span id="provider-layers-summary"></span><span id="provider-layers-note"></span></dd>
    </dl>
    <button id="btn-set-default" type="button" style="display:none"></button>
  </section>
</div>

<div id="status"></div>

<script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js" crossorigin=""></script>
<script>
'use strict'

// ── i18n ──────────────────────────────────────────────────────────────────────
const LANG = (navigator.language || 'en').toLowerCase().startsWith('fr') ? 'fr' : 'en'

const I18N = {
  fr: {
    layerWind: 'Vent', layerGust: 'Rafales', layerTemp: 'Température', layerWaterTemp: 'Eau',
    layerCloud: 'Nébulosité', layerPrecip: 'Précipitations', layerPress: 'Pression',
    forecast: 'Prévision', source: 'Source', grid: 'Grille', refresh: 'Rafraîchir',
    setDefault: n => `Définir "${n}" par défaut`,
    providerInfo: 'Informations du fournisseur', providerPlugin: 'Plugin fournisseur',
    providerStatus: 'Statut', providerDefault: 'Fournisseur par défaut', providerNotDefault: 'Fournisseur sélectionné',
    providerPeriod: 'Période de prévision', providerSteps: 'Pas disponibles', providerLayers: 'Couches disponibles', providerClose: 'Fermer',
    providerNoData: 'Aucune donnée chargée', providerStepCount: n => `${n} pas`,
    providerUnsupportedNote: '* disponible mais non affichable sur cette carte',
    providerCurrent: 'Courant', providerWaves: 'Vagues', providerSwell: 'Houle', providerTides: 'Marées', providerHumidity: 'Humidité',
    tipWind: 'Vent', tipGust: 'Rafales', tipKnots: 'nœuds', tipFrom: 'de',
    tipTemp: 'Temp', tipWaterTemp: 'Eau', tipPressure: 'MSLP', tipHumidity: 'Humidité',
    tipCloud: 'Nuages', tipPrecip: 'Précip.',
    legendWind: 'Vent', legendGust: 'Rafales',
    legendTemp: 'Température', legendWaterTemp: 'Température de l’eau', legendCloud: 'Nébulosité', legendPrecip: 'Précipitations', legendPress: 'Pression',
    windDesc:   'Bleu → Vert → Jaune → Orange → Rouge selon la vitesse<br>Barbules affichées si zoom suffisant',
    gustDesc:   'Même échelle — basé sur la rafale maximale<br>Barbules affichées si zoom suffisant',
    barbDesc:   '½ trait = 5 nœuds &nbsp;|&nbsp; trait = 10 nœuds<br>fanion = 50 nœuds &nbsp;|&nbsp; ○ = calme (&lt;3 nœuds)',
    tempDesc:   'Bleu = froid &nbsp;|&nbsp; Vert = tempéré &nbsp;|&nbsp; Rouge = chaud',
    waterTempDesc: 'Bleu = eau froide &nbsp;|&nbsp; Vert = eau tempérée &nbsp;|&nbsp; Rouge = eau chaude',
    cloudDesc:  'Transparent = ciel clair &nbsp;|&nbsp; Gris foncé = couvert à 100%',
    precipDesc: 'Transparent = sec &nbsp;|&nbsp; Bleu clair = légère pluie<br>Bleu → Violet → Rouge = intensité croissante',
    pressDesc:  'Bleu foncé (&lt;960) → Bleu → Cyan → Vert (1013) → Jaune → Orange → Rouge (&gt;1022 hPa)',
    playTimeline: 'Lire la prévision', pauseTimeline: 'Mettre la lecture en pause',
    loading: (d, n) => `Chargement… ${d}/${n}`,
    loadingRetry: (d, n, attempt, max) => `Chargement… ${d}/${n} — nouvelle tentative (${attempt}/${max})`,
    errSet: m => `Erreur : ${m}`,
    errFetch: n => `${n} point(s) inaccessible(s)`,
    errNoSource: 'Aucun fournisseur météo actif. Installez et activez un plugin fournisseur dans le tableau de bord SignalK.',
    errConnect: 'Impossible de contacter le serveur SignalK. Vérifiez que le serveur est démarré.',
    now: 'maintenant', ago: h => `il y a ${h}h`, inN: h => `dans ${h}h`,
  },
  en: {
    layerWind: 'Wind', layerGust: 'Gusts', layerTemp: 'Temperature', layerWaterTemp: 'Water',
    layerCloud: 'Cloudiness', layerPrecip: 'Precipitation', layerPress: 'Pressure',
    forecast: 'Forecast', source: 'Source', grid: 'Grid', refresh: 'Refresh',
    setDefault: n => `Set "${n}" as default`,
    providerInfo: 'Provider information', providerPlugin: 'Provider plugin',
    providerStatus: 'Status', providerDefault: 'Default provider', providerNotDefault: 'Selected provider',
    providerPeriod: 'Forecast period', providerSteps: 'Available steps', providerLayers: 'Available layers', providerClose: 'Close',
    providerNoData: 'No data loaded', providerStepCount: n => `${n} steps`,
    providerUnsupportedNote: '* available but not displayable on this map',
    providerCurrent: 'Current', providerWaves: 'Waves', providerSwell: 'Swell', providerTides: 'Tides', providerHumidity: 'Humidity',
    tipWind: 'Wind', tipGust: 'Gusts', tipKnots: 'kt', tipFrom: 'from',
    tipTemp: 'Temp', tipWaterTemp: 'Water', tipPressure: 'MSLP', tipHumidity: 'Humidity',
    tipCloud: 'Cloud', tipPrecip: 'Precip.',
    legendWind: 'Wind', legendGust: 'Gusts',
    legendTemp: 'Temperature', legendWaterTemp: 'Water temperature', legendCloud: 'Cloudiness', legendPrecip: 'Precipitation', legendPress: 'Pressure',
    windDesc:   'Blue → Green → Yellow → Orange → Red by speed<br>Barbs shown when zoomed in',
    gustDesc:   'Same scale — based on maximum gust<br>Barbs shown when zoomed in',
    barbDesc:   '½ bar = 5 kt &nbsp;|&nbsp; bar = 10 kt<br>pennant = 50 kt &nbsp;|&nbsp; ○ = calm (&lt;3 kt)',
    tempDesc:   'Blue = cold &nbsp;|&nbsp; Green = temperate &nbsp;|&nbsp; Red = hot',
    waterTempDesc: 'Blue = cold water &nbsp;|&nbsp; Green = temperate water &nbsp;|&nbsp; Red = warm water',
    cloudDesc:  'Transparent = clear sky &nbsp;|&nbsp; Dark grey = overcast',
    precipDesc: 'Transparent = dry &nbsp;|&nbsp; Light blue = light rain<br>Blue → Purple → Red = increasing intensity',
    pressDesc:  'Dark blue (&lt;960) → Blue → Cyan → Green (1013) → Yellow → Orange → Red (&gt;1022 hPa)',
    playTimeline: 'Play forecast', pauseTimeline: 'Pause forecast playback',
    loading: (d, n) => `Loading… ${d}/${n}`,
    loadingRetry: (d, n, attempt, max) => `Loading… ${d}/${n} — retrying (${attempt}/${max})`,
    errSet: m => `Error: ${m}`,
    errFetch: n => `${n} point(s) failed to load`,
    errNoSource: 'No active weather provider. Install and enable a weather provider plugin in the SignalK dashboard.',
    errConnect: 'Cannot reach the SignalK server. Check that the server is running.',
    now: 'now', ago: h => `${h}h ago`, inN: h => `in ${h}h`,
  }
}
const t = I18N[LANG]

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t[el.dataset.i18n] ?? el.textContent
  })
}

// ── Config ────────────────────────────────────────────────────────────────────
const SK        = window.location.origin
const CACHE_TTL = 30 * 60 * 1000
const NO_DATA_CACHE_TTL = 5 * 60 * 1000
const CONC      = 15
const LS_PFX    = 'skwx2_'
// Écritures localStorage regroupées : un stringify+setItem synchrone par point
// (~500 par chargement, ~5 Mo) bloque le main thread et dépasse vite le quota.
const LS_FLUSH_DELAY       = 1000  // ms — coalescer les rafales d'écriture
const LS_FLUSH_MAX_PENDING = 100   // flush immédiat au-delà de N clés en attente

// ── State ─────────────────────────────────────────────────────────────────────
const memCache    = new Map()
const noDataCache = new Map()   // short-lived, memory-only provider no-coverage results
const barbLayers  = new Map()
const labelLayers = new Map()   // étiquettes texte (layer temp)
const markerSnapshots = new Map()
const failedPoints = new Set() // only exhausted request failures permit a three-corner fallback
let   allTimes   = []
let   curTimeIdx = 0
let   timelinePlaybackTimer = null
let   abortCtrl  = null
let   defaultProviderId = null   // provider actuellement par défaut côté SignalK
let   currentStep  = null        // pas de grille du dernier rendu
let   gridStepNeedsUpdate = true // only a real zoom may change grid density
let   currentLayer = 'wind'      // wind, gust, air/water temperature, cloud, precipitation or pressure
let   providerInfoReturnFocus = null

// ── Map ───────────────────────────────────────────────────────────────────────
// Keep the familiar OSM raster tiles as a deliberately simple background. The
// globe and weather overlays are rendered by MapLibre/WebGL above it.
let map = null
let mapReady = false
let heatOverlay = false
let tooltipPopup = null
// The only points allowed to reach the map. Keeping this separate from the
// cross-view cache prevents an old viewport from leaking into a new one.
let activeGrid = new Map()
let activeGridGeneration = 0

// Start with the same geographical area on every device rather than a fixed
// zoom level. A fixed zoom shows much more of the world on a large display and
// consequently requests many more forecast points. MapLibre may add margins
// for portrait/wide aspect ratios, but this 6° square always remains the common
// reference area around the vessel.
const INITIAL_VIEW_SPAN = 6
const INITIAL_VIEW_MAX_LAT = 84

function initialWeatherBounds(lon, lat) {
  const half = INITIAL_VIEW_SPAN / 2
  const south = Math.max(-INITIAL_VIEW_MAX_LAT, Math.min(INITIAL_VIEW_MAX_LAT - INITIAL_VIEW_SPAN, lat - half))
  return [[lon - half, south], [lon + half, south + INITIAL_VIEW_SPAN]]
}

function fitInitialWeatherView(lon, lat) {
  map.fitBounds(initialWeatherBounds(lon, lat), { duration: 0, maxZoom: 6.5 })
}

function showGpuFailure() {
  document.getElementById('gpu-error').hidden = false
  document.getElementById('panel').style.display = 'none'
  document.getElementById('legend').style.display = 'none'
  document.getElementById('btn-show-legend').style.display = 'none'
}

function markMapReady() {
  if (mapReady) return
  mapReady = true
  refresh()
}

try {
  map = new maplibregl.Map({
    container: 'map',
    bounds: initialWeatherBounds(2.5, 48.5),
    fitBoundsOptions: { duration: 0, maxZoom: 6.5 },
    // Be explicit: this webapp is a map, not a scrolling page. In particular,
    // Safari must receive the touch gestures instead of interpreting them as
    // browser navigation or page zoom.
    dragPan: true,
    dragRotate: true,
    scrollZoom: true,
    doubleClickZoom: true,
    touchZoomRotate: true,
    touchPitch: true,
    keyboard: true,
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          maxzoom: 19,
          attribution: '© OpenStreetMap contributors',
        },
      },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }],
    },
  })
  map.addControl(new maplibregl.NavigationControl(), 'top-left')
  map.on('load', () => {
    map.dragPan.enable()
    map.dragRotate.enable()
    map.scrollZoom.enable()
    map.doubleClickZoom.enable()
    map.touchZoomRotate.enable()
    map.touchPitch.enable()
    map.keyboard.enable()
    map.getCanvas().style.touchAction = 'none'
    map.getCanvasContainer().style.touchAction = 'none'
    try {
      map.setProjection({ type: 'globe' })
    } catch (error) {
      // Do not leave the whole weather application inert if a browser rejects
      // the projection change after it has already created a usable WebGL map.
      console.error('Unable to enable globe projection', error)
      showStatus('Globe projection unavailable in this browser')
    }
    markMapReady()
  })
  // Some Safari/WebGL combinations report style readiness through idle before
  // their load callback. This is deliberately a one-way readiness fallback.
  map.once('idle', markMapReady)
  map.on('error', event => {
    if (maplibregl.GPUInitializationError && event.error instanceof maplibregl.GPUInitializationError) showGpuFailure()
    else console.error(event.error)
  })
} catch (error) {
  if (maplibregl.GPUInitializationError && error instanceof maplibregl.GPUInitializationError) showGpuFailure()
  else throw error
}

// ── Cache ─────────────────────────────────────────────────────────────────────
function lsGet(key) {
  try {
    const raw = localStorage.getItem(LS_PFX + key)
    if (!raw) return null
    const e = JSON.parse(raw)
    if (Date.now() - e.ts > CACHE_TTL) { localStorage.removeItem(LS_PFX + key); return null }
    return e
  } catch { return null }
}

// Les écritures passent par une file d'attente vidée par lsFlush() :
// le cache mémoire reste autoritaire pour la session, localStorage n'est
// qu'une persistance au rechargement.
const lsPending = new Map()   // key → { ts, data } en attente d'écriture
let   lsDisabled  = false     // quota irrécupérable → mémoire seule pour la session
let   lsFlushTimer = null

function lsSet(key, data) {
  if (lsDisabled) return
  lsPending.set(key, { ts: Date.now(), data })
  if (lsPending.size >= LS_FLUSH_MAX_PENDING) { lsFlush(); return }
  clearTimeout(lsFlushTimer)
  lsFlushTimer = setTimeout(lsFlush, LS_FLUSH_DELAY)
}

function lsRemove(key) {
  lsPending.delete(key)
  try { localStorage.removeItem(LS_PFX + key) } catch {}
}

function lsFlush() {
  clearTimeout(lsFlushTimer)
  lsFlushTimer = null
  if (lsPending.size === 0) return
  const entries = [...lsPending]
  lsPending.clear()
  for (const [key, e] of entries) {
    try {
      localStorage.setItem(LS_PFX + key, JSON.stringify(e))
    } catch {
      // Quota dépassé : libérer de l'espace puis réessayer une fois ;
      // sinon abandonner la persistance pour la session.
      if (!lsEvictForSpace()) { lsDisabled = true; return }
      try { localStorage.setItem(LS_PFX + key, JSON.stringify(e)) }
      catch { lsDisabled = true; return }
    }
  }
}

// Libère de l'espace localStorage : supprime les entrées périmées/vides/corrompues,
// puis à défaut les plus anciennes. Retourne true si quelque chose a été supprimé.
function lsEvictForSpace() {
  try {
    const now = Date.now()
    const live = []
    let removed = false
    for (const k of Object.keys(localStorage)) {
      if (!k.startsWith(LS_PFX)) continue
      try {
        const e = JSON.parse(localStorage.getItem(k))
        if (!e || !Array.isArray(e.data) || e.data.length === 0 || now - e.ts > CACHE_TTL) {
          localStorage.removeItem(k)
          removed = true
        } else {
          live.push([e.ts, k])
        }
      } catch { localStorage.removeItem(k); removed = true }
    }
    if (!removed && live.length > 0) {
      live.sort((a, b) => a[0] - b[0])
      for (const [, k] of live.slice(0, Math.max(1, Math.floor(live.length / 4)))) {
        localStorage.removeItem(k)
      }
      removed = true
    }
    return removed
  } catch (e) {
    // SecurityError or other storage-access failure: disable localStorage for the session
    lsDisabled = true
    return false
  }
}

function purgeLs() {
  let keys
  try { keys = Object.keys(localStorage) } catch { lsDisabled = true; return }
  for (const k of keys) {
    if (!k.startsWith(LS_PFX)) continue
    try {
      const e = JSON.parse(localStorage.getItem(k))
      if (Date.now() - e.ts > CACHE_TTL) { localStorage.removeItem(k); continue }
      if (!Array.isArray(e.data) || e.data.length === 0) localStorage.removeItem(k)
    } catch { try { localStorage.removeItem(k) } catch { lsDisabled = true; return } }
  }
}

function cacheKey(lat, lon, provider) {
  const prov = provider ?? document.getElementById('sel-source').value
  return `${prov}|${lat.toFixed(2)},${lon.toFixed(2)}`
}

function getCached(key) {
  const m = memCache.get(key)
  if (m) {
    if (Date.now() - m.ts < CACHE_TTL && Array.isArray(m.data) && m.data.length > 0) return m.data
    memCache.delete(key)  // expired or empty — evict
  }
  const s = lsGet(key)
  if (s && Array.isArray(s.data) && s.data.length > 0) {
    memCache.set(key, { ts: s.ts, data: s.data })
    return s.data
  }
  return null
}

function hasNoDataCached(key) {
  const timestamp = noDataCache.get(key)
  if (timestamp == null) return false
  if (Date.now() - timestamp < NO_DATA_CACHE_TTL) return true
  noDataCache.delete(key)
  return false
}

function setNoDataCached(key) {
  noDataCache.set(key, Date.now())
}

function setCached(key, data) {
  if (!Array.isArray(data) || data.length === 0) return  // ne pas cacher les résultats vides
  memCache.set(key, { ts: Date.now(), data })
  noDataCache.delete(key)
  lsSet(key, data)   // écriture différée — voir lsFlush()
}

// getCached n'évince qu'à l'accès : sans sweep, les entrées des zones quittées
// resteraient en mémoire indéfiniment sur une longue session.
setInterval(() => {
  const now = Date.now()
  for (const [k, e] of memCache) if (now - e.ts >= CACHE_TTL) memCache.delete(k)
  for (const [k, ts] of noDataCache) if (now - ts >= NO_DATA_CACHE_TTL) noDataCache.delete(k)
}, 5 * 60_000)

// ── Auto grid step ────────────────────────────────────────────────────────────
// Target ~36px between barbs. The 4° tier makes the world view slightly denser
// than the former 5° grid without a large increase in requests or polygons.
const GRID_TARGET_PX = 36
const GRID_STEPS = [0.05, 0.1, 0.25, 0.5, 1, 2, 4, 5, 7.5, 10]
// Forecasts stop short of the geographic poles: providers generally do not
// offer useful regular grids beyond this latitude.
const MAX_WEATHER_LAT = 84.75

function degreesPerPixelAtZoom() {
  // Globe getBounds() is a perspective footprint: it changes as the globe is
  // rotated even when map.getZoom() does not. Use MapLibre's 512px world size
  // instead, so one zoom level always selects one stable forecast grid step.
  return 360 / (512 * (2 ** map.getZoom()))
}

function autoStep() {
  const degPerPx = degreesPerPixelAtZoom()
  const raw = degPerPx * GRID_TARGET_PX
  return GRID_STEPS.find(s => s >= raw) ?? 10
}

// Keep this below the 36px target grid spacing. Otherwise a correctly loaded
// denser grid can hide every barb at the very zoom level that selected it.
const MIN_OVERLAY_PX = 30

function cellPixelSize() {
  return (currentStep || 0.25) / degreesPerPixelAtZoom()
}

// ── Wind barb SVG ─────────────────────────────────────────────────────────────
function kt(mps) { return mps * 1.94384 }

function barbSVG(speedMps, dirRad) {
  const knots = kt(speedMps)
  const S = 56, C = S / 2, STAFF = 36, BL = 13, SP = 7
  const COL = '#1a3a6b'

  if (knots < 3) {
    return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">
      <circle cx="${C}" cy="${C}" r="5" fill="none" stroke="${COL}" stroke-width="2"/>
    </svg>`
  }

  let y = C - STAFF / 2
  let spd = Math.round(knots / 5) * 5
  const parts = [`<line x1="${C}" y1="${C-STAFF/2}" x2="${C}" y2="${C+STAFF/2}" stroke="${COL}" stroke-width="2"/>`]

  while (spd >= 50) {
    parts.push(`<polygon points="${C},${y} ${C+BL},${y+3.5} ${C},${y+7}" fill="${COL}"/>`)
    y += 9; spd -= 50
  }
  while (spd >= 10) {
    parts.push(`<line x1="${C}" y1="${y}" x2="${C+BL}" y2="${y-5}" stroke="${COL}" stroke-width="2"/>`)
    y += SP; spd -= 10
  }
  if (spd >= 5) {
    parts.push(`<line x1="${C}" y1="${y}" x2="${C+BL*0.55}" y2="${y-2.5}" stroke="${COL}" stroke-width="2"/>`)
  }

  const deg = (dirRad * 180 / Math.PI).toFixed(1)
  return `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}"
    style="transform:rotate(var(--weather-rotation,${deg}deg));transform-origin:${C}px ${C}px">${parts.join('')}</svg>`
}

function gradientLegend(stops, ticks, unit) {
  const min = ticks[0], max = ticks[ticks.length - 1]
  const percent = value => (value - min) / (max - min) * 100
  const colors = stops.filter(([value]) => value >= min && value <= max)
    .map(([value, r, g, b]) => `rgb(${r},${g},${b}) ${percent(value)}%`).join(',')
  const labels = ticks.map((value, i) => `<span style="position:absolute;left:${percent(value)}%;transform:translateX(${i === 0 ? '0' : i === ticks.length - 1 ? '-100%' : '-50%'})">${value}</span>`).join('')
  return `<div style="height:7px;border-radius:2px;margin:3px 0 1px;background:linear-gradient(to right,${colors})"></div><div style="position:relative;height:14px;font-size:9px;color:#888">${labels}</div><div style="text-align:right;font-size:9px;color:#888">${unit}</div>`
}

// ── Canvas heatmap ────────────────────────────────────────────────────────────
// Temperature color stops [tempC, r, g, b] — mirrors tempColor() but int-valued.
const TEMP_STOPS = [
  [-20,  0,  0, 200],
  [  0,  0,204, 238],
  [ 15, 34,170,  68],
  [ 25,255,204,   0],
  [ 35,255, 51,   0],
  [ 60,200,  0,   0],
]

// Sea-surface temperatures have a much narrower useful range than air
// temperatures. Keeping dedicated stops makes cold and warm water gradients
// readable without saturating normal ocean values.
const WATER_TEMP_STOPS = [
  [-2,  0,  30, 170],
  [ 2,  0, 105, 220],
  [ 8,  0, 195, 225],
  [15, 45, 175,  95],
  [22,225, 205,  30],
  [28,255, 125,  20],
  [35,205,  25,  20],
]

// [value, r, g, b, alpha]. These retain the familiar reference colours while
// supplying a continuous transition between them rather than hard colour bands.
const WIND_COLOR_STOPS = [
  [ 0,179,217,255,150], [ 5,100,181,246,160], [10, 76,175, 80,125],
  [15,205,220, 57,138], [20,255,235, 59,150], [25,255,152,  0,163],
  [30,244, 67, 54,176], [40,183, 28, 28,189], [50,123, 31,162,202],
]

const PRESSURE_COLOR_STOPS = [
  [930, 20,  0,150,210], [960, 50, 80,220,191], [975, 80,150,230,178],
  [990,100,200,210,155], [1005,110,200,140,140], [1013,160,210,60,150], [1018,240,130,20,165],
  [1022,190, 30, 10,185], [1050,190, 30, 10,185],
]
const WIND_GRADIENT_HTML = gradientLegend(WIND_COLOR_STOPS, [0, 5, 10, 20, 30, 40, 50], 'kt')
const PRESSURE_GRADIENT_HTML = gradientLegend(PRESSURE_COLOR_STOPS, [930, 960, 990, 1013, 1022], 'hPa')

function interpolateColorStops(stops, value) {
  if (value <= stops[0][0]) return stops[0].slice(1)
  const last = stops[stops.length - 1]
  if (value >= last[0]) return last.slice(1)
  let i = 0
  while (stops[i + 1][0] < value) i++
  const s0 = stops[i], s1 = stops[i + 1]
  const f = (value - s0[0]) / (s1[0] - s0[0])
  return [1, 2, 3, 4].map(index => Math.round(s0[index] + (s1[index] - s0[index]) * f))
}

function extractValue(f, layer) {
  if (!f) return null
  if (layer === 'wind')   return f.wind?.speedTrue ?? null
  if (layer === 'gust')   return f.wind?.gust       ?? null
  if (layer === 'temp')   return f.outside?.temperature ?? null
  if (layer === 'waterTemp') return f.water?.temperature ?? null
  if (layer === 'cloud')  return f.outside?.cloudCover  ?? null
  if (layer === 'precip') { const v = f.outside?.precipitationVolume; return v == null ? null : v * 1000 }
  if (layer === 'press')  { const v = f.outside?.pressure;            return v == null ? null : v / 100 }
  return null
}

// All color computations return [r, g, b, a] (integers) — no string allocation.
function valueToRgba(value, layer) {
  if (value === null) return null
  if (layer === 'wind' || layer === 'gust') {
    const k = value * 1.94384
    return interpolateColorStops(WIND_COLOR_STOPS, k)
  }
  if (layer === 'temp' || layer === 'waterTemp') {
    const t = value - 273.15
    const stops = layer === 'waterTemp' ? WATER_TEMP_STOPS : TEMP_STOPS
    let i = 0
    while (i < stops.length - 2 && stops[i+1][0] <= t) i++
    const s0 = stops[i], s1 = stops[i+1]
    const f = Math.max(0, Math.min(1, (t - s0[0]) / (s1[0] - s0[0])))
    return [
      Math.round(s0[1] + (s1[1]-s0[1])*f),
      Math.round(s0[2] + (s1[2]-s0[2])*f),
      Math.round(s0[3] + (s1[3]-s0[3])*f),
      128,
    ]
  }
  if (layer === 'cloud')  return [80, 80, 80, Math.round(value * 153)]
  if (layer === 'precip') {
    if (value < 0.1) return null
    if (value <  1)  return [144,202,249, 77]
    if (value <  5)  return [ 30,136,229,128]
    if (value < 15)  return [ 94, 53,177,153]
    if (value < 30)  return [229, 57, 53,178]
    return                  [183, 28, 28,204]
  }
  if (layer === 'press') {
    return interpolateColorStops(PRESSURE_COLOR_STOPS, value)
  }
  return null
}

// Native MapLibre cells are clipped by the globe and retain their geographical
// position after any pan or rotation. Forecast values are points on the active
// grid, so subdivide the areas between them with bilinear interpolation instead
// of displaying one large, flat-coloured square per forecast point.
const WEATHER_SUBDIVISIONS = 4
let displayedWeather = null
let pendingWeather = null
let queuedWeather = null
let weatherSequence = 0

function removeWeatherSource(id) {
  if (map.getLayer(id)) map.removeLayer(id)
  if (map.getSource(id)) map.removeSource(id)
}

function cancelPendingWeather() {
  queuedWeather = null
  const pending = pendingWeather
  if (!pending) return
  pendingWeather = null
  map.off('render', pending.onRender)
  map.off('error', pending.onError)
  clearTimeout(pending.deadline)
  removeWeatherSource(pending.id)
  if (displayedWeather && map.getLayer(displayedWeather.id)) {
    map.setPaintProperty(displayedWeather.id, 'fill-opacity', 1)
  }
}

// Load tiles in an invisible layer while retaining the previous complete
// snapshot. Show the new layer, then update its DOM markers in that render's
// callback (before browser paint). No marker ever reads a newer live cache.
function stageWeatherSnapshot(data, snapshot) {
  const id = `weather-heatmap-${++weatherSequence}`
  const pending = { id, snapshot, presenting: false }
  pendingWeather = pending
  const fail = error => {
    if (pendingWeather !== pending) return
    cancelPendingWeather()
    showError(`Weather render failed: ${error.message ?? error}`)
  }
  pending.onError = event => { if (event.sourceId === id) fail(event.error) }
  pending.onRender = () => {
    if (pendingWeather !== pending) return
    if (mapIsMoving || snapshot.generation !== refreshGen || snapshot.time !== curTime() || snapshot.layer !== currentLayer) {
      cancelPendingWeather()
      return
    }
    try {
      if (!pending.presenting) {
        if (!map.isSourceLoaded(id)) return
        map.setPaintProperty(id, 'fill-opacity', 1)
        if (displayedWeather && map.getLayer(displayedWeather.id)) map.setPaintProperty(displayedWeather.id, 'fill-opacity', 0)
        pending.presenting = true
        map.triggerRepaint()
        return
      }
      // This frame has drawn the replacement; commit matching markers now.
      renderActiveWeatherMarkers(snapshot)
      const previous = displayedWeather
      displayedWeather = { id, snapshot }
      heatOverlay = true
      pendingWeather = null
      map.off('render', pending.onRender)
      map.off('error', pending.onError)
      clearTimeout(pending.deadline)
      if (previous) removeWeatherSource(previous.id)
      const next = queuedWeather
      queuedWeather = null
      if (next) scheduleHeatmapRender(next)
    } catch (error) { fail(error) }
  }
  map.on('render', pending.onRender)
  map.on('error', pending.onError)
  pending.deadline = setTimeout(() => fail(new Error('Render timed out')), 15000)
  try {
    map.addSource(id, { type: 'geojson', data })
    map.addLayer({ id, type: 'fill', source: id, paint: {
      'fill-color': ['get', 'color'], 'fill-opacity': 0, 'fill-antialias': false,
      'fill-opacity-transition': { duration: 0, delay: 0 },
    } })
  } catch (error) { fail(error) }
}

function renderHeatmap({ allowEmpty = true } = {}) {
  if (!mapReady) return false
  if (mapIsMoving || activeGridGeneration !== refreshGen) return false
  if (pendingWeather) {
    // Coalesce network progress into one follow-up; do not abort slow worker
    // work every second or it may never finish on a mobile device.
    queuedWeather = { allowEmpty: allowEmpty || queuedWeather?.allowEmpty === true, generation: refreshGen }
    return false
  }
  const step = currentStep || autoStep()
  const features = []
  const values = new Map()
  let interpolatedCells = 0
  const failedCoordinates = new Set()
  const snapshot = { generation: refreshGen, time: curTime(), layer: currentLayer, step, points: new Map() }

  // Match positions by coordinate rather than cache key: cache keys include the
  // provider, while the interpolation neighbours are spatial grid points.
  function pointKey(lat, lon) {
    const normalLon = ((lon % 360) + 540) % 360 - 180
    return `${Math.round(lat * 1e6)},${Math.round(normalLon * 1e6)}`
  }

  for (const [key, point] of activeGrid) {
    const data = getCached(key)
    if (!data) {
      if (failedPoints.has(key) && !hasNoDataCached(key)) failedCoordinates.add(pointKey(point.lat, point.lon))
      continue
    }
    const forecast = pickForecast(data, snapshot.time)
    if (forecast) snapshot.points.set(key, { ...point, forecast })
    const value = extractValue(forecast, snapshot.layer)
    if (value == null || !Number.isFinite(value)) continue
    values.set(pointKey(point.lat, point.lon), value)
  }

  // Keep the feature count proportional to the current grid. At global scale
  // two subdivisions already remove the coarse 5°/10° blocks; closer views get
  // a denser gradient without making Safari build tens of thousands of shapes.
  const subdivisions = step >= 4 ? 2 : step >= 1 ? 3 : WEATHER_SUBDIVISIONS

  function addCell(west, east, south, north, color, opacity) {
    if (west >= east || south >= north) return
    features.push({
      type: 'Feature',
      properties: { color, opacity },
      geometry: { type: 'Polygon', coordinates: [[
        [west, north], [east, north], [east, south], [west, south], [west, north],
      ]] },
    })
  }

  function addWrappedCell(west, east, south, north, color, opacity) {
    // Split a cell that crosses the anti-meridian; a single polygon spanning
    // 179° to -179° would otherwise be interpreted as covering most Earth.
    if (west < -180) {
      addCell(-180, east, south, north, color, opacity)
      addCell(west + 360, 180, south, north, color, opacity)
    } else if (east > 180) {
      addCell(west, 180, south, north, color, opacity)
      addCell(-180, east - 360, south, north, color, opacity)
    } else {
      addCell(west, east, south, north, color, opacity)
    }
  }

  function interpolateCellValue(corners, x, y) {
    const weights = [
      (1 - x) * (1 - y), x * (1 - y), (1 - x) * y, x * y,
    ]
    let available = 0
    let totalWeight = 0
    let weightedValue = 0
    for (let i = 0; i < corners.length; i++) {
      if (!Number.isFinite(corners[i])) continue
      available++
      totalWeight += weights[i]
      weightedValue += corners[i] * weights[i]
    }
    // Three values preserve a local, continuous field when one request has
    // ultimately failed. With fewer than three, leaving the area empty is more
    // honest than extrapolating weather across an unknown region.
    return available >= 3 && totalWeight > 0 ? weightedValue / totalWeight : null
  }

  for (const [key, point] of activeGrid) {
    const { lat, lon } = point
    const northLat = lat + step
    if (northLat > MAX_WEATHER_LAT + 1e-9) continue
    const eastLon = ((lon + step + 540) % 360) - 180
    const vSW = values.get(pointKey(lat, lon))
    const vSE = values.get(pointKey(lat, eastLon))
    const vNW = values.get(pointKey(northLat, lon))
    const vNE = values.get(pointKey(northLat, eastLon))
    const corners = [vSW, vSE, vNW, vNE]
    const cornerKeys = [pointKey(lat, lon), pointKey(lat, eastLon), pointKey(northLat, lon), pointKey(northLat, eastLon)]
    // Empty coverage, missing layers/times and points still downloading must
    // remain empty. Only a genuinely failed request can use the fallback.
    if (corners.some((value, i) => !Number.isFinite(value) && !failedCoordinates.has(cornerKeys[i]))) continue

    // Prefer exact bilinear interpolation from all four corners. A local,
    // normalized three-corner fallback avoids a large gap from one exhausted
    // request while never consulting a previous view or provider.
    if (corners.filter(Number.isFinite).length < 3) continue
    interpolatedCells++

    for (let y = 0; y < subdivisions; y++) {
      const y0 = y / subdivisions
      const y1 = (y + 1) / subdivisions
      const centreY = (y0 + y1) / 2
      const south = lat + y0 * step
      const north = lat + y1 * step

      for (let x = 0; x < subdivisions; x++) {
        const x0 = x / subdivisions
        const x1 = (x + 1) / subdivisions
        const centreX = (x0 + x1) / 2
        // Bilinear interpolation at the centre of each geographical sub-cell.
        // With all corners it returns the exact usual bilinear field.
        const value = interpolateCellValue(corners, centreX, centreY)
        const rgba = valueToRgba(value, currentLayer)
        if (!rgba) continue

        const west = lon + x0 * step
        const east = lon + x1 * step
        // Put per-cell alpha in colour so showing a staged layer only changes
        // a constant opacity. Changing a data-driven opacity expression would
        // reload its worker buckets and invalidate the readiness check.
        const color = `rgba(${rgba[0]},${rgba[1]},${rgba[2]},${rgba[3] / 255})`
        addWrappedCell(west, east, south, north, color, rgba[3] / 255)
      }
    }
  }

  const data = { type: 'FeatureCollection', features }
  // A provisional refresh must not erase a useful prior layer merely because
  // its first few responses cannot form a complete interpolated cell yet.
  if (!allowEmpty && interpolatedCells === 0) return false
  stageWeatherSnapshot(data, snapshot)
  return true
}

// Keep the current view during the gesture itself. Once the camera is still,
// partial results may be revealed at a bounded cadence while the replacement
// batch continues downloading.
const HEATMAP_IDLE_DELAY = 0
const PROGRESSIVE_RENDER_INTERVAL = 1000
let heatmapTimer = null
let heatmapFrame = null
let mapIsMoving = false
let progressiveRenderTimer = null
let progressiveRenderFrame = null
let progressiveLastRender = 0

function cancelScheduledHeatmap() {
  clearTimeout(heatmapTimer)
  if (heatmapFrame != null) cancelAnimationFrame(heatmapFrame)
  heatmapTimer = null
  heatmapFrame = null
}

function scheduleHeatmapRender({ delay = HEATMAP_IDLE_DELAY, generation = refreshGen, allowEmpty = true } = {}) {
  cancelScheduledHeatmap()
  if (mapIsMoving) return
  heatmapTimer = setTimeout(() => {
    heatmapTimer = null
    heatmapFrame = requestAnimationFrame(() => {
      heatmapFrame = null
      if (mapIsMoving || generation !== refreshGen) return
      renderHeatmap({ allowEmpty })
    })
  }, delay)
}

function cancelProgressiveWeatherRender() {
  clearTimeout(progressiveRenderTimer)
  if (progressiveRenderFrame != null) cancelAnimationFrame(progressiveRenderFrame)
  progressiveRenderTimer = null
  progressiveRenderFrame = null
}

function renderActiveWeatherMarkers(snapshot) {
  const large = snapshot.step / degreesPerPixelAtZoom() >= MIN_OVERLAY_PX
  for (const key of barbLayers.keys()) if (!snapshot.points.has(key)) removeMarker(key)
  for (const [key, { lat, lon, forecast }] of snapshot.points) {
    const previous = markerSnapshots.get(key)
    if (previous?.forecast === forecast && previous.layer === snapshot.layer && previous.large === large) continue
    renderMarker(key, lat, lon, forecast, snapshot.layer, large)
    markerSnapshots.set(key, { forecast, layer: snapshot.layer, large })
  }
}

// At first load, expose a useful partial picture, but never rebuild markers or
// GeoJSON for every individual request. This keeps Safari responsive and makes
// a batch of hundreds of points visually progress about once per second.
function scheduleProgressiveWeatherRender(generation) {
  if (mapIsMoving || generation !== refreshGen) return
  // The timeout hands off to a browser frame. Keep coalescing responses during
  // that handoff too: Safari may receive many responses before its next paint.
  // Otherwise each response queues a full redraw and only the last is tracked
  // for cancellation.
  if (progressiveRenderTimer != null || progressiveRenderFrame != null) return
  const elapsed = Date.now() - progressiveLastRender
  const delay = Math.max(0, PROGRESSIVE_RENDER_INTERVAL - elapsed)
  progressiveRenderTimer = setTimeout(() => {
    progressiveRenderTimer = null
    progressiveRenderFrame = requestAnimationFrame(() => {
      progressiveRenderFrame = null
      if (mapIsMoving || generation !== refreshGen || activeGridGeneration !== generation) return
      progressiveLastRender = Date.now()
      // Only replace old colours and barbs together once enough new points
      // form at least one interpolated cell. This prevents a blank heatmap
      // between the start of a large request and its first useful result.
      renderHeatmap({ allowEmpty: false })
    })
  }, delay)
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
async function fetchWithTimeout(url, { signal, timeout = 15000, ...options } = {}, read = r => r.json()) {
  const controller = new AbortController()
  const abort = () => controller.abort()
  let timedOut = false
  if (signal?.aborted) abort()
  else signal?.addEventListener('abort', abort, { once: true })
  const timer = setTimeout(() => { timedOut = true; controller.abort() }, timeout)
  try {
    const response = await fetch(url, { ...options, signal: controller.signal })
    if (!response.ok) {
      const error = new Error(`HTTP ${response.status}`)
      error.permanent = response.status >= 400 && response.status < 500 && response.status !== 429
      throw error
    }
    // The deadline also covers downloading/parsing the response body.
    return await read(response)
  } catch (error) {
    if (signal?.aborted) throw new DOMException('Aborted', 'AbortError')
    if (timedOut) throw new Error('Request timed out')
    throw error
  } finally {
    clearTimeout(timer)
    signal?.removeEventListener('abort', abort)
  }
}

async function fetchPoint(lat, lon, source, signal, onRetry = null) {
  const key = cacheKey(lat, lon, source)
  const hit = getCached(key)
  if (hit) return { key, lat, lon, data: hit }
  if (hasNoDataCached(key)) return { key, lat, lon, data: [] }

  const url = new URL(`${SK}/signalk/v2/api/weather/forecasts/point`)
  url.searchParams.set('lat', lat.toFixed(4))
  url.searchParams.set('lon', lon.toFixed(4))
  if (source) url.searchParams.set('provider', source)

  const MAX_ATTEMPTS = 4
  let delay = 500  // ms, doublé à chaque tentative
  let lastError = null
  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    if (signal.aborted) throw new DOMException('Aborted', 'AbortError')
    try {
      const data = await fetchWithTimeout(url.toString(), { signal })
      // A valid empty array is provider no-coverage, not a request failure.
      // Malformed responses remain retryable through the catch below.
      if (!Array.isArray(data)) throw new Error('invalid forecast response')
      if (data.length > 0) setCached(key, data)
      else setNoDataCached(key)
      return { key, lat, lon, data }
    } catch (error) {
      // Abort : propager. Réseau, JSON invalide, 5xx et 429 restent
      // réessayables. Les 4xx permanents n'occupent pas inutilement
      // les workers jusqu'à l'épuisement des tentatives.
      if (signal.aborted || error.name === 'AbortError') throw error
      if (error.permanent) throw error
      lastError = error
    }
    if (attempt < MAX_ATTEMPTS) {
      onRetry?.({ attempt: attempt + 1, maxAttempts: MAX_ATTEMPTS })
      await new Promise((res, rej) => {
        const abort = () => { clearTimeout(tid); rej(new DOMException('Aborted', 'AbortError')) }
        const tid = setTimeout(() => { signal.removeEventListener('abort', abort); res() }, delay)
        if (signal.aborted) abort()
        else signal.addEventListener('abort', abort, { once: true })
      })
      delay *= 2
    }
  }
  throw lastError ?? new Error('max retries exceeded')
}

async function fetchBatch(points, source, onResult) {
  let i = 0, done = 0, failed = 0
  const total = points.length
  if (abortCtrl) abortCtrl.abort()
  abortCtrl = new AbortController()
  const sig = abortCtrl.signal
  showStatus(t.loading(done, total))

  async function worker() {
    while (i < points.length && !sig.aborted) {
      const [lat, lon] = points[i++]
      try {
        const res = await fetchPoint(lat, lon, source, sig, ({ attempt, maxAttempts }) => {
          if (!sig.aborted) showStatus(t.loadingRetry(done, total, attempt, maxAttempts))
        })
        if (!sig.aborted) {
          failedPoints.delete(res.key)
          if (res.data.length > 0) onResult(res)
          done++
          showStatus(t.loading(done, total))
        }
      } catch (e) {
        if (!sig.aborted) {
          done++
          if (e.name !== 'AbortError') {
            failed++
            failedPoints.add(cacheKey(lat, lon, source))
          }
          showStatus(t.loading(done, total))
        }
      }
    }
  }

  await Promise.all(Array.from({ length: CONC }, worker))
  if (!sig.aborted) {
    if (failed > 0) { showStatus(t.errFetch(failed)); setTimeout(() => showStatus(null), 4000) }
    else showStatus(null)
  }
}

// ── Grid ──────────────────────────────────────────────────────────────────────
function computeGrid(bounds, step) {
  // Interpolation needs the north/east neighbours of every visible cell. Ask
  // for one extra grid ring on every side so a viewport edge (and a small view
  // narrower than one cell) is still backed by four forecast corners.
  const GRID_EDGE_MARGIN = 1
  const lastLatitudeIndex = Math.floor(MAX_WEATHER_LAT / step)
  const S = Math.round(Math.max(-lastLatitudeIndex, Math.floor(bounds.getSouth() / step) - GRID_EDGE_MARGIN) * step * 1e6) / 1e6
  const N = Math.round(Math.min( lastLatitudeIndex, Math.ceil(bounds.getNorth() / step) + GRID_EDGE_MARGIN) * step * 1e6) / 1e6
  const W = Math.floor(bounds.getWest() / step) * step - GRID_EDGE_MARGIN * step
  // Cap at one full circumference to avoid duplicates when view wraps antimeridian.
  // Subtract half-step so the last generated lon doesn't wrap back to W after normalization.
  // Normalize each lon to [-180, 180) so cache keys stay canonical.
  const E = Math.min(Math.ceil(bounds.getEast() / step) * step + GRID_EDGE_MARGIN * step, W + 360 - step * 0.5)
  const pts = []
  for (let lat = S; lat <= N + 1e-9; lat = Math.round((lat + step) * 1e6) / 1e6) {
    if (lat < -MAX_WEATHER_LAT || lat > MAX_WEATHER_LAT) continue
    for (let lon = W; lon <= E + 1e-9; lon = Math.round((lon + step) * 1e6) / 1e6) {
      const nLon = ((lon % 360) + 540) % 360 - 180
      pts.push([lat, nLon])
    }
  }
  return pts
}

// ── Barb rendering ────────────────────────────────────────────────────────────
function curTime() { return allTimes[curTimeIdx] ?? null }

function pickForecast(data, time = curTime()) {
  if (!data || data.length === 0) return null
  if (!time) return data.find(f => f && Number.isFinite(Date.parse(f.date))) ?? null
  const target = Date.parse(time)
  if (!Number.isFinite(target)) return null
  let best = null, bestDiff = Infinity, first = Infinity, last = -Infinity
  for (const f of data) {
    const ts = Date.parse(f?.date)
    if (!Number.isFinite(ts)) continue
    first = Math.min(first, ts)
    last = Math.max(last, ts)
    const d = Math.abs(ts - target)
    if (d < bestDiff) { bestDiff = d; best = f }
  }
  // Never extend coverage past either endpoint. Inside coverage, tolerate at
  // most half a normal three-hour step; larger gaps remain explicitly empty.
  return target >= first && target <= last && bestDiff <= 90 * 60_000 ? best : null
}

// DOM markers preserve the existing barbs and labels while the canvas source is
// draped over the globe by MapLibre. A transparent marker supplies the tooltip.
function clearVisualMarker(key) {
  const marker = labelLayers.get(key)
  if (marker) { marker.remove(); labelLayers.delete(key) }
}

function clearWeatherMarkers() {
  if (tooltipPopup) { tooltipPopup.remove(); tooltipPopup = null }
  for (const marker of barbLayers.values()) marker.remove()
  for (const marker of labelLayers.values()) marker.remove()
  barbLayers.clear()
  labelLayers.clear()
  markerSnapshots.clear()
}

// Project a short geodesic through the point in both directions. Unlike simply
// subtracting map bearing, this also follows local north near the globe edge
// and with a tilted camera. These calculations do not fetch/rebuild forecasts.
function projectedBearing(lat, lon, bearing) {
  const rad = Math.PI / 180, phi = lat * rad, theta = bearing * rad
  function point(distance) {
    const latitude = Math.asin(Math.sin(phi) * Math.cos(distance) + Math.cos(phi) * Math.sin(distance) * Math.cos(theta))
    const longitude = lon + Math.atan2(Math.sin(theta) * Math.sin(distance) * Math.cos(phi), Math.cos(distance) - Math.sin(phi) * Math.sin(latitude)) / rad
    return map.project([longitude, latitude / rad])
  }
  const a = point(-0.00001), b = point(0.00001)
  return Math.atan2(b.x - a.x, a.y - b.y) / rad
}

function orientMarker(marker) {
  const element = marker.getElement()
  if (element.weatherBearing == null) return
  const angle = projectedBearing(element.weatherLat, element.weatherLon, element.weatherBearing)
  if (Number.isFinite(angle)) element.style.setProperty('--weather-rotation', `${angle}deg`)
}

function orientWeatherMarkers() {
  for (const marker of labelLayers.values()) orientMarker(marker)
  if (vesselMarker) orientMarker(vesselMarker)
}

function setTooltipMarker(key, lat, lon, html) {
  let marker = barbLayers.get(key)
  if (!marker) {
    const element = document.createElement('div')
    element.className = 'weather-tooltip-hit'
    element.setAttribute('aria-label', 'Weather information')
    const show = () => {
      if (!mapReady) return
      if (tooltipPopup) tooltipPopup.remove()
      tooltipPopup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 10 })
        .setLngLat([element.weatherLon, element.weatherLat])
        .setHTML(element.weatherHtml)
        .addTo(map)
    }
    element.addEventListener('mouseenter', show)
    element.addEventListener('click', show)
    element.addEventListener('mouseleave', () => {
      if (tooltipPopup) { tooltipPopup.remove(); tooltipPopup = null }
    })
    marker = new maplibregl.Marker({ element, anchor: 'center', opacityWhenCovered: 0 }).setLngLat([lon, lat]).addTo(map)
    barbLayers.set(key, marker)
  }
  const element = marker.getElement()
  element.weatherLat = lat
  element.weatherLon = lon
  element.weatherHtml = html
}

function setVisualMarker(key, lat, lon, html, width, height, bearing = null) {
  let marker = labelLayers.get(key)
  if (!marker) {
    const element = document.createElement('div')
    element.className = 'wind-barb-icon'
    // MapLibre requires a position before addTo(); unlike Leaflet it does not
    // accept an unpositioned marker even for a single render frame.
    marker = new maplibregl.Marker({ element, anchor: 'center', opacityWhenCovered: 0 }).setLngLat([lon, lat]).addTo(map)
    labelLayers.set(key, marker)
  }
  const element = marker.getElement()
  if (element.weatherHtml !== html) {
    element.style.width = `${width}px`
    element.style.height = `${height}px`
    element.innerHTML = html
    element.weatherHtml = html
  }
  element.weatherLat = lat
  element.weatherLon = lon
  element.weatherBearing = bearing
  orientMarker(marker)
}

function renderMarker(key, lat, lon, f, layer = currentLayer, large = cellPixelSize() >= MIN_OVERLAY_PX) {
  if (!f || !mapReady) { removeMarker(key); return }
  setTooltipMarker(key, lat, lon, buildTooltip(lat, lon, f))

  if (layer === 'wind' || layer === 'gust') {
    const speed = layer === 'wind' ? f.wind?.speedTrue : f.wind?.gust
    const direction = f.wind?.directionTrue
    if (!Number.isFinite(speed) || !Number.isFinite(direction) || !large) { clearVisualMarker(key); return }
    setVisualMarker(key, lat, lon, barbSVG(speed, direction), 56, 56, direction * 180 / Math.PI)
  } else if (layer === 'temp' || layer === 'waterTemp') {
    const temperature = layer === 'temp' ? f.outside?.temperature : f.water?.temperature
    if (temperature == null || !large) { clearVisualMarker(key); return }
    const tempC = temperature - 273.15
    const label = (tempC >= 0 ? '+' : '') + tempC.toFixed(1) + '°'
    setVisualMarker(key, lat, lon, `<div style="font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none;line-height:1">${label}</div>`, 40, 14)
  } else if (layer === 'press') {
    if (f.outside?.pressure == null || !large) { clearVisualMarker(key); return }
    setVisualMarker(key, lat, lon, `<div style="font-size:10px;font-weight:700;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9),0 0 6px rgba(0,0,0,.6);white-space:nowrap;pointer-events:none;line-height:1">${Math.round(f.outside.pressure / 100)}</div>`, 40, 14)
  } else {
    clearVisualMarker(key)
  }
}

function removeMarker(key) {
  const marker = barbLayers.get(key)
  if (marker) { marker.remove(); barbLayers.delete(key) }
  clearVisualMarker(key)
  markerSnapshots.delete(key)
}
function buildTooltip(lat, lon, f) {
  const d      = new Date(f.date)
  const speed  = f.wind?.speedTrue
  const dir    = f.wind?.directionTrue
  const gust   = f.wind?.gust
  const temp   = f.outside?.temperature
  const waterTemp = f.water?.temperature
  const pres   = f.outside?.pressure
  const humid  = f.outside?.relativeHumidity
  const cloud  = f.outside?.cloudCover
  const precip = f.outside?.precipitationVolume   // en mètres

  let html = `<b>${lat.toFixed(2)}°, ${lon.toFixed(2)}°</b><br>${fmtUtc(d)}<hr style="margin:3px 0">`
  if (speed != null && dir != null)
    html += `${t.tipWind}&nbsp;: <b>${kt(speed).toFixed(0)} ${t.tipKnots}</b> ${t.tipFrom} ${(dir * 180 / Math.PI).toFixed(0)}°<br>`
  if (gust  != null)
    html += `${t.tipGust}&nbsp;: <b>${kt(gust).toFixed(0)} ${t.tipKnots}</b><br>`
  if (temp  != null) html += `${t.tipTemp}&nbsp;: ${(temp - 273.15).toFixed(1)}°C &nbsp; `
  if (waterTemp != null) html += `${t.tipWaterTemp}&nbsp;: ${(waterTemp - 273.15).toFixed(1)}°C<br>`
  if (pres  != null) html += `${t.tipPressure}&nbsp;: ${(pres / 100).toFixed(0)} hPa<br>`
  if (humid != null) html += `${t.tipHumidity}&nbsp;: ${(humid * 100).toFixed(0)}% &nbsp; `
  if (cloud != null) html += `${t.tipCloud}&nbsp;: ${(cloud * 100).toFixed(0)}%<br>`
  if (precip != null) html += `${t.tipPrecip}&nbsp;: ${(precip * 1000).toFixed(1)} mm`
  return html
}

// ── Time slider ───────────────────────────────────────────────────────────────
function fmtUtc(d) {
  const dd  = d.getUTCDate().toString().padStart(2,'0')
  const mm  = (d.getUTCMonth()+1).toString().padStart(2,'0')
  const hh  = d.getUTCHours().toString().padStart(2,'0')
  const mi  = d.getUTCMinutes().toString().padStart(2,'0')
  return `${dd}/${mm} ${hh}:${mi} UTC`
}

function fmtRelative(iso) {
  const diff = (new Date(iso) - Date.now()) / 3600_000
  if (Math.abs(diff) < 1) return t.now
  if (diff < 0) return t.ago(Math.round(-diff))
  return t.inN(Math.round(diff))
}

const TIMELINE_PLAYBACK_INTERVAL = 1000

function updateTimelinePlaybackButton() {
  const button = document.getElementById('btn-time-play')
  const playing = timelinePlaybackTimer != null
  button.textContent = playing ? '❚❚' : '▶'
  button.disabled = allTimes.length < 2
  const label = playing ? t.pauseTimeline : t.playTimeline
  button.setAttribute('aria-label', label)
  button.title = label
}

function stopTimelinePlayback() {
  if (timelinePlaybackTimer != null) clearInterval(timelinePlaybackTimer)
  timelinePlaybackTimer = null
  updateTimelinePlaybackButton()
}

function toggleTimelinePlayback() {
  if (timelinePlaybackTimer != null) {
    stopTimelinePlayback()
    return
  }
  if (allTimes.length < 2) return
  timelinePlaybackTimer = setInterval(() => {
    if (allTimes.length < 2) { stopTimelinePlayback(); return }
    // Give a slow renderer time to present its frame; never skip through dates
    // while the map is moving or a previous frame is still being prepared.
    if (mapIsMoving || pendingWeather || activeGridGeneration !== refreshGen) return
    selectTimeIndex((curTimeIdx + 1) % allTimes.length, { fromPlayback: true })
  }, TIMELINE_PLAYBACK_INTERVAL)
  updateTimelinePlaybackButton()
}

function selectTimeIndex(index, { fromPlayback = false } = {}) {
  if (index < 0 || index >= allTimes.length || index === curTimeIdx) return
  if (!fromPlayback) stopTimelinePlayback()
  curTimeIdx = index
  updateSliderUI()
  rerender()
}

function renderTimelineTicks() {
  const ticks = document.getElementById('time-ticks')
  ticks.replaceChildren()
  if (allTimes.length === 0) return

  let previousDay = null
  let dayGroup = -1
  allTimes.forEach((iso, index) => {
    const date = new Date(iso)
    const day = date.toISOString().slice(0, 10)
    const left = String(allTimes.length === 1 ? 50 : index / (allTimes.length - 1) * 100) + '%'
    if (day !== previousDay) {
      previousDay = day
      dayGroup++
      const label = document.createElement('span')
      label.className = 'time-day'
      label.style.left = left
      label.textContent = String(date.getUTCDate()).padStart(2, '0') + '/' + String(date.getUTCMonth() + 1).padStart(2, '0')
      ticks.append(label)
    }
    const tick = document.createElement('button')
    tick.type = 'button'
    tick.className = 'time-tick day-' + (dayGroup % 2 ? 'b' : 'a') + (index === curTimeIdx ? ' active' : '')
    tick.style.left = left
    tick.title = fmtUtc(date)
    tick.setAttribute('aria-label', fmtUtc(date))
    tick.addEventListener('click', () => selectTimeIndex(index))
    ticks.append(tick)
  })
}

function updateSliderUI() {
  const slider = document.getElementById('slider-time')
  const disp   = document.getElementById('time-display')
  const sec    = document.getElementById('time-secondary')
  const prev   = document.getElementById('btn-time-prev')
  const next   = document.getElementById('btn-time-next')
  const start  = document.getElementById('time-start')
  const end    = document.getElementById('time-end')

  if (allTimes.length === 0) {
    if (timelinePlaybackTimer != null) clearInterval(timelinePlaybackTimer)
    timelinePlaybackTimer = null
    disp.textContent = '—'
    sec.textContent  = ''
    slider.disabled  = true
    prev.disabled = true
    next.disabled = true
    start.textContent = '—'
    end.textContent = '—'
    updateTimelinePlaybackButton()
    renderTimelineTicks()
    return
  }

  slider.disabled = false
  slider.min   = 0
  slider.max   = allTimes.length - 1
  slider.value = curTimeIdx

  const iso = allTimes[curTimeIdx]
  disp.textContent = fmtUtc(new Date(iso))
  sec.textContent  = fmtRelative(iso)
  start.textContent = fmtUtc(new Date(allTimes[0]))
  end.textContent = fmtUtc(new Date(allTimes[allTimes.length - 1]))
  prev.disabled = curTimeIdx === 0
  next.disabled = curTimeIdx === allTimes.length - 1
  updateTimelinePlaybackButton()
  renderTimelineTicks()
}

function ingestTimes(data) {
  const set = new Set(allTimes)
  for (const f of data) if (f?.date && Number.isFinite(Date.parse(f.date))) set.add(f.date)
  if (set.size === allTimes.length) return false
  // Preserve the currently selected ISO string across re-sorts so that prepending
  // earlier timestamps doesn't silently move the slider to a different point in time.
  const prevIso = allTimes[curTimeIdx] ?? null
  allTimes = Array.from(set).sort()
  if (prevIso) {
    const newIdx = allTimes.indexOf(prevIso)
    curTimeIdx = newIdx >= 0 ? newIdx : Math.min(curTimeIdx, allTimes.length - 1)
  } else if (allTimes.length > 0) {
    const now = Date.now()
    const futureIdx = allTimes.findIndex(t => new Date(t) >= now)
    curTimeIdx = futureIdx >= 0 ? futureIdx : 0
  }
  updateSliderUI()
  if (!document.getElementById('provider-info-dialog').hidden) renderProviderInfo()
  return true
}

// ── Source discovery ──────────────────────────────────────────────────────────
// Uses GET /signalk/v2/api/weather/_providers — only lists providers that are
// actually started and registered. Disabled plugins won't appear here.
async function discoverSources(attempt = 1) {
  try {
    const providers = await fetchWithTimeout(`${SK}/signalk/v2/api/weather/_providers`)

    const sel = document.getElementById('sel-source')
    sel.innerHTML = ''
    defaultProviderId = null

    for (const [id, info] of Object.entries(providers)) {
      const opt = document.createElement('option')
      opt.value = id
      opt.textContent = info.name + (info.isDefault ? ' ★' : '')
      if (info.isDefault) { opt.selected = true; defaultProviderId = id }
      sel.appendChild(opt)
    }

    if (sel.options.length === 0) {
      showError(t.errNoSource)
      setControlsDisabled(true)
      return
    }

    setControlsDisabled(false)
    showStatus(null)
    updateDefaultBtn()
    refresh()
  } catch {
    // SignalK peut encore être en train de démarrer — réessayer avec backoff.
    if (attempt < 4) {
      setTimeout(() => discoverSources(attempt + 1), attempt * 2000)
    } else {
      showError(t.errConnect)
      setControlsDisabled(true)
    }
  }
}

function updateDefaultBtn() {
  const btn = document.getElementById('btn-set-default')
  const selected = document.getElementById('sel-source').value
  if (!selected || selected === defaultProviderId) {
    btn.style.display = 'none'
  } else {
    btn.style.display = 'block'
    const name = document.getElementById('sel-source').selectedOptions[0]?.text ?? selected
    btn.textContent = t.setDefault(name)
  }
}

function selectedProviderName() {
  const sel = document.getElementById('sel-source')
  return (sel.selectedOptions[0]?.textContent ?? sel.value).replace(/ ★$/, '')
}

function providerLayerAvailability(provider) {
  const has = { wind: false, gust: false, temp: false, waterTemp: false, cloud: false, precip: false, press: false }
  let scanned = 0
  for (const [key, entry] of memCache) {
    if (!key.startsWith(provider + '|') || Date.now() - entry.ts >= CACHE_TTL) continue
    try {
      for (const f of entry.data) {
        if (f.wind?.speedTrue != null)              has.wind   = true
        if (f.wind?.gust != null)                   has.gust   = true
        if (f.outside?.temperature != null)         has.temp   = true
        if (f.water?.temperature != null)           has.waterTemp = true
        if (f.outside?.cloudCover != null)          has.cloud  = true
        if (f.outside?.precipitationVolume != null) has.precip = true
        if (f.outside?.pressure != null)            has.press  = true
        if (Object.values(has).every(Boolean)) break
      }
    } catch {}
    if (Object.values(has).every(Boolean) || ++scanned >= 30) break
  }
  return has
}

// The weather API does not publish a capability manifest.  Inspect a bounded
// sample of the forecasts already loaded for this provider so the information
// sheet can also mention data that this map does not yet render.
function providerUnsupportedLayers(provider) {
  const layers = new Set()
  const renderedFields = {
    outside: new Set(['temperature', 'cloudCover', 'precipitationVolume', 'pressure']),
    water: new Set(['temperature']),
  }
  let scanned = 0
  for (const [key, entry] of memCache) {
    if (!key.startsWith(provider + '|') || Date.now() - entry.ts >= CACHE_TTL) continue
    try {
      for (const f of entry.data) {
        if (!f || typeof f !== 'object') continue
        for (const [group, value] of Object.entries(f)) {
          if (value == null || group === 'date' || group === 'wind') continue
          if (renderedFields[group] && typeof value === 'object') {
            for (const [field, fieldValue] of Object.entries(value)) {
              if (fieldValue != null && !renderedFields[group].has(field)) layers.add(`${group}.${field}`)
            }
          } else {
            layers.add(group)
          }
        }
      }
    } catch {}
    if (++scanned >= 30) break
  }
  return Array.from(layers).sort().map(providerLayerLabel)
}

function providerLayerLabel(key) {
  const labels = {
    current: t.providerCurrent, currents: t.providerCurrent,
    wave: t.providerWaves, waves: t.providerWaves,
    swell: t.providerSwell, tide: t.providerTides, tides: t.providerTides,
    'outside.relativeHumidity': t.providerHumidity,
    'water.current': t.providerCurrent, 'water.currents': t.providerCurrent,
    'water.wave': t.providerWaves, 'water.waves': t.providerWaves,
    'water.swell': t.providerSwell, 'water.tide': t.providerTides, 'water.tides': t.providerTides,
  }
  if (labels[key]) return labels[key]
  return key
    .replace(/^outside\./, '')
    .replace(/([a-z])([A-Z])/g, '$1 $2')
    .replace(/[_-]+/g, ' ')
    .replace(/^./, char => char.toUpperCase())
}

function setProviderInfoVisible(visible) {
  const dialog = document.getElementById('provider-info-dialog')
  if (visible) {
    if (!dialog.contains(document.activeElement)) {
      providerInfoReturnFocus = document.activeElement instanceof HTMLElement
        ? document.activeElement
        : document.getElementById('btn-provider-info')
    }
    dialog.hidden = false
    requestAnimationFrame(() => document.getElementById('btn-close-provider').focus())
    return
  }
  dialog.hidden = true
  const trigger = providerInfoReturnFocus || document.getElementById('btn-provider-info')
  providerInfoReturnFocus = null
  if (trigger?.isConnected) trigger.focus()
}

function keepProviderInfoFocus(event) {
  if (event.key === 'Escape') {
    event.preventDefault()
    setProviderInfoVisible(false)
    return
  }
  if (event.key !== 'Tab') return

  const dialog = document.getElementById('provider-info-dialog')
  const focusable = Array.from(dialog.querySelectorAll('button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'))
    .filter(el => el.offsetParent !== null)
  if (focusable.length === 0) return
  const first = focusable[0]
  const last = focusable[focusable.length - 1]
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault()
    last.focus()
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault()
    first.focus()
  }
}

function renderProviderInfo() {
  const provider = document.getElementById('sel-source').value
  if (!provider) return
  const has = providerLayerAvailability(provider)
  const layerLabels = {
    wind: t.layerWind, gust: t.layerGust, temp: t.layerTemp, waterTemp: t.layerWaterTemp,
    cloud: t.layerCloud, precip: t.layerPrecip, press: t.layerPress,
  }
  const available = Object.entries(has).filter(([, value]) => value).map(([key]) => layerLabels[key])
  const unsupported = providerUnsupportedLayers(provider)
  const period = allTimes.length
    ? `${fmtUtc(new Date(allTimes[0]))} — ${fmtUtc(new Date(allTimes[allTimes.length - 1]))}`
    : t.providerNoData

  document.getElementById('provider-info-title').textContent = selectedProviderName()
  document.getElementById('provider-plugin-label').textContent = t.providerPlugin
  document.getElementById('provider-plugin').textContent = provider
  document.getElementById('provider-status-label').textContent = t.providerStatus
  document.getElementById('provider-status').textContent = provider === defaultProviderId ? t.providerDefault : t.providerNotDefault
  document.getElementById('provider-period-label').textContent = t.providerPeriod
  document.getElementById('provider-period').textContent = period
  document.getElementById('provider-steps-label').textContent = t.providerSteps
  document.getElementById('provider-steps').textContent = allTimes.length ? t.providerStepCount(allTimes.length) : t.providerNoData
  document.getElementById('provider-layers-label').textContent = t.providerLayers
  const listedLayers = [...available, ...unsupported.map(label => `${label} *`)]
  document.getElementById('provider-layers-summary').textContent = listedLayers.length ? listedLayers.join(', ') : t.providerNoData
  document.getElementById('provider-layers-note').textContent = unsupported.length ? t.providerUnsupportedNote : ''
  updateDefaultBtn()
}

function openProviderInfo() {
  if (!document.getElementById('sel-source').value) return
  renderProviderInfo()
  setProviderInfoVisible(true)
}

async function setDefaultProvider(id) {
  const btn = document.getElementById('btn-set-default')
  btn.disabled = true
  try {
    await fetchWithTimeout(`${SK}/signalk/v2/api/weather/_providers/_default/${encodeURIComponent(id)}`, { method: 'POST' }, r => r.text())
    defaultProviderId = id
    // Mettre à jour le ★ dans le sélecteur
    for (const opt of document.getElementById('sel-source').options) {
      opt.textContent = opt.textContent.replace(' ★', '')
      if (opt.value === id) opt.textContent += ' ★'
    }
    updateDefaultBtn()
    if (!document.getElementById('provider-info-dialog').hidden && btn.style.display === 'none') {
      document.getElementById('btn-close-provider').focus()
    }
    if (!document.getElementById('provider-info-dialog').hidden) renderProviderInfo()
  } catch (e) {
    showStatus(t.errSet(e.message))
    setTimeout(() => showStatus(null), 3000)
  } finally {
    btn.disabled = false
  }
}

// ── Main refresh ──────────────────────────────────────────────────────────────
let debounce = null
let refreshGen = 0  // incremented each doRefresh; stale instances bail out early

function refresh() {
  clearTimeout(debounce)
  debounce = setTimeout(doRefresh, 350)
}

async function doRefresh() {
  debounce = null
  if (!mapReady || mapIsMoving) return
  try {
  const gen    = ++refreshGen   // capture generation at start
  const source = document.getElementById('sel-source').value
  // MapLibre can become ready before provider discovery completes. Never issue
  // an implicit/default-provider request or commit an anonymous cache grid.
  if (!source) return
  cancelScheduledHeatmap()
  cancelProgressiveWeatherRender()
  cancelPendingWeather()
  failedPoints.clear()
  // The prior layer remains visible while the gesture is in progress. Once
  // moveend has started this batch, progressively reveal the new viewport.
  progressiveLastRender = 0
  const bounds  = map.getBounds()
  // MapLibre emits moveend after both a pan and a zoom. Reusing the current
  // step for panning guarantees that a same-scale move always samples the
  // same forecast grid; zoomend is the only event that authorises a change.
  const step    = currentStep == null || gridStepNeedsUpdate ? autoStep() : currentStep
  gridStepNeedsUpdate = false
  const center  = map.getCenter()

  document.getElementById('grid-info').textContent = `auto (${step}°)`

  const pts = computeGrid(bounds, step)
  pts.sort((a, b) =>
    Math.hypot(a[0]-center.lat, a[1]-center.lng) - Math.hypot(b[0]-center.lat, b[1]-center.lng))

  // Prepare the next view atomically. The existing geographic layer followed
  // the globe throughout the gesture; after release, its successor can appear
