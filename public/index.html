  // progressively as valid points arrive.
  currentStep = step
  activeGrid = new Map(pts.map(([lat, lon]) => [cacheKey(lat, lon, source), { lat, lon }]))
  activeGridGeneration = gen

  let hasCachedPoints = false
  for (const [key, { lat, lon }] of activeGrid) {
    const data = getCached(key)
    if (data) {
      hasCachedPoints = true
      ingestTimes(data)
    }
  }

  // Cached points are useful immediately; network responses join the same
  // bounded progressive redraw below.
  if (hasCachedPoints) scheduleProgressiveWeatherRender(gen)

  const missing = Array.from(activeGrid, ([key, { lat, lon }]) => getCached(key) ? null : [lat, lon]).filter(Boolean)
  if (missing.length > 0) {
    await fetchBatch(missing, source, ({ key, lat, lon, data }) => {
      if (gen !== refreshGen || activeGridGeneration !== gen || !activeGrid.has(key)) return
      ingestTimes(data)
      scheduleProgressiveWeatherRender(gen)
    })
  } else {
    showStatus(null)
  }

  // Données valides quelle que soit la génération : persister tout de suite
  lsFlush()

  if (gen !== refreshGen) return  // superseded pendant le fetch — ne pas écraser l'état
  // Complete the replacement atomically, superseding any provisional view that
  // was revealed while this batch downloaded.
  cancelProgressiveWeatherRender()
  scheduleHeatmapRender({ delay: 0, generation: gen })
  updateLayerButtons()
  if (!document.getElementById('provider-info-dialog').hidden) renderProviderInfo()
  } catch (error) {
    console.error('Weather refresh failed', error)
    showError(`Weather refresh failed: ${error.message ?? error}`)
  }
}

// ── Layer availability ────────────────────────────────────────────────────────
function updateLayerButtons() {
  const provider = document.getElementById('sel-source').value
  const has = providerLayerAvailability(provider)

  // Si aucun champ reconnu n'a été trouvé, garder tous les boutons visibles
  // (provider non encore chargé, format inconnu, hors zone…)
  if (!Object.values(has).some(v => v)) return

  let activeStillVisible = false
  document.querySelectorAll('.layer-btn').forEach(btn => {
    const show = has[btn.dataset.layer] === true
    btn.style.display = show ? '' : 'none'
    if (btn.classList.contains('active') && show) activeStillVisible = true
  })

  // Si la couche active n'a plus de données, basculer sur la première disponible.
  if (!activeStillVisible) {
    const first = Array.from(document.querySelectorAll('.layer-btn')).find(b => b.style.display !== 'none')
    if (first) first.click()
  }
}

function latLonFromKey(key) {
  // key = "provider|lat,lon"
  const coords = key.includes('|') ? key.split('|')[1] : key
  const [latStr, lonStr] = coords.split(',')
  return [parseFloat(latStr), parseFloat(lonStr)]
}

function rerender() {
  if (activeGridGeneration !== refreshGen) return
  cancelPendingWeather()
  scheduleHeatmapRender({ delay: 100 })
}

function clearHeatmap() {
  cancelScheduledHeatmap()
  cancelPendingWeather()
  if (displayedWeather) removeWeatherSource(displayedWeather.id)
  displayedWeather = null
  heatOverlay = false
}

function rerenderAll() {
  // Re-render the exact active request, never the global cross-view cache.
  cancelPendingWeather()
  if (activeGridGeneration === refreshGen && activeGrid.size > 0) rerender()
  else refresh()
}

function updateLegend() {
  const el = document.getElementById('legend-text')
  if (currentLayer === 'wind') {
    el.innerHTML = `<b>${t.legendWind}</b>${WIND_GRADIENT_HTML}${t.windDesc}<br><span style="font-size:10px;color:#888">${t.barbDesc}</span>`
  } else if (currentLayer === 'gust') {
    el.innerHTML = `<b>${t.legendGust}</b>${WIND_GRADIENT_HTML}${t.gustDesc}<br><span style="font-size:10px;color:#888">${t.barbDesc}</span>`
  } else if (currentLayer === 'temp') {
    el.innerHTML = `<b>${t.legendTemp}</b>${t.tempDesc}`
  } else if (currentLayer === 'waterTemp') {
    el.innerHTML = `<b>${t.legendWaterTemp}</b>${t.waterTempDesc}`
  } else if (currentLayer === 'cloud') {
    el.innerHTML = `<b>${t.legendCloud}</b>${t.cloudDesc}`
  } else if (currentLayer === 'precip') {
    el.innerHTML = `<b>${t.legendPrecip}</b>${t.precipDesc}`
  } else if (currentLayer === 'press') {
    el.innerHTML = `<b>${t.legendPress}</b>${PRESSURE_GRADIENT_HTML}${t.pressDesc}`
  } else {
    el.innerHTML = `<b>${t.legendPrecip}</b>${t.precipDesc}`
  }
}

// ── Status ────────────────────────────────────────────────────────────────────
function showStatus(msg) {
  const el = document.getElementById('status')
  el.classList.remove('error')
  if (msg) { el.textContent = msg; el.style.display = 'block' }
  else       el.style.display = 'none'
}

function showError(msg) {
  const el = document.getElementById('status')
  el.classList.add('error')
  el.textContent = msg
  el.style.display = 'block'
}

function setControlsDisabled(disabled) {
  if (disabled) stopTimelinePlayback()
  document.getElementById('slider-time').disabled = disabled
  document.getElementById('btn-time-prev').disabled = disabled || curTimeIdx === 0
  document.getElementById('btn-time-next').disabled = disabled || curTimeIdx === allTimes.length - 1
  document.getElementById('btn-time-play').disabled = disabled || allTimes.length < 2
  document.getElementById('btn-provider-info').disabled = disabled
  document.querySelectorAll('.layer-btn').forEach(b => { b.disabled = disabled })
}

// ── Vessel ────────────────────────────────────────────────────────────────────
let vesselMarker = null
let cameraMoved = false

function vesselHtml(hdgDeg) {
  return `<svg viewBox="0 0 20 30" width="20" height="30"
    style="transform:rotate(var(--weather-rotation,${hdgDeg}deg));transform-origin:50% 50%;display:block;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,0.6))">
    <polygon points="10,1 19,27 10,22 1,27"
      fill="#2196F3" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`
}

async function centerOnVessel() {
  try {
    const [pos, h] = await Promise.all([
      fetchWithTimeout(`${SK}/signalk/v1/api/vessels/self/navigation/position`, { credentials: 'include', timeout: 5000 }),
      fetchWithTimeout(`${SK}/signalk/v1/api/vessels/self/navigation/headingTrue`, { credentials: 'include', timeout: 5000 }).catch(() => null),
    ])
    const lat = pos.value?.latitude ?? pos.latitude
    const lon = pos.value?.longitude ?? pos.longitude
    if (lat == null || lon == null) return

    let hdgDeg = 0
    if (h != null) {
      const hdgRad = typeof h?.value === 'number' ? h.value : (typeof h === 'number' ? h : null)
      if (hdgRad != null) hdgDeg = hdgRad * 180 / Math.PI
    }

    if (!map) return
    if (!vesselMarker) {
      const element = document.createElement('div')
      element.className = 'wind-barb-icon'
      element.style.width = '20px'
      element.style.height = '30px'
      vesselMarker = new maplibregl.Marker({ element, anchor: 'center', opacityWhenCovered: 0 }).setLngLat([lon, lat]).addTo(map)
    }
    vesselMarker.getElement().innerHTML = vesselHtml(hdgDeg)
    Object.assign(vesselMarker.getElement(), { weatherLat: lat, weatherLon: lon, weatherBearing: hdgDeg })
    vesselMarker.setLngLat([lon, lat])
    orientMarker(vesselMarker)
    // Use a fixed geographical extent: a fixed zoom would load a much wider
    // area on a large monitor than on a phone.
    if (!cameraMoved) fitInitialWeatherView(lon, lat)
  } catch {}
}

// ── Legend visibility ─────────────────────────────────────────────────────────
function setLegendVisible(visible) {
  document.getElementById('legend').style.display = visible ? 'block' : 'none'
  document.getElementById('btn-show-legend').style.display = visible ? 'none' : 'block'
  try { localStorage.setItem('skwx_legend', visible ? '1' : '0') } catch {}
}

// ── Boot ──────────────────────────────────────────────────────────────────────
;(async () => {
  document.documentElement.lang = LANG
  applyI18n()
  purgeLs()
  updateSliderUI()
  // Persister les écritures en attente avant que l'onglet ne parte (localStorage = synchrone)
  window.addEventListener('pagehide', lsFlush)
  window.addEventListener('pagehide', stopTimelinePlayback)
  // Position is optional; a slow navigation endpoint must not hold the UI.
  void centerOnVessel()

  updateLegend()

  // Prevent rapid double taps on controls from reaching browser zoom gestures.
  const dock = document.getElementById('panel')
  dock.addEventListener('dblclick', e => { e.preventDefault(); e.stopPropagation() })

  const providerDialog = document.getElementById('provider-info-dialog')
  providerDialog.addEventListener('click', e => {
    if (e.target === providerDialog) setProviderInfoVisible(false)
  })
  providerDialog.addEventListener('keydown', keepProviderInfoFocus)
  document.getElementById('btn-provider-info').setAttribute('aria-label', t.providerInfo)
  document.getElementById('btn-provider-info').title = t.providerInfo
  document.getElementById('btn-close-provider').setAttribute('aria-label', t.providerClose)
  document.getElementById('btn-provider-info').addEventListener('click', openProviderInfo)
  document.getElementById('btn-close-provider').addEventListener('click', () => setProviderInfoVisible(false))

  try { if (localStorage.getItem('skwx_legend') === '0') setLegendVisible(false) } catch {}
  document.getElementById('btn-toggle-legend').addEventListener('click', () => setLegendVisible(false))
  document.getElementById('btn-show-legend').addEventListener('click', () => setLegendVisible(true))

  document.querySelectorAll('.layer-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.layer === currentLayer) return
      document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'))
      btn.classList.add('active')
      currentLayer = btn.dataset.layer
      updateLegend()
      rerenderAll()
    })
  })

  if (map) {
    map.on('movestart', () => {
      mapIsMoving = true
      cameraMoved = true
      clearTimeout(debounce)
      debounce = null
      // Invalidate in-flight work, but keep the last complete layer visible.
      // It remains geographically anchored by MapLibre while the globe moves.
      refreshGen++
      if (abortCtrl) abortCtrl.abort()
      cancelScheduledHeatmap()
      cancelProgressiveWeatherRender()
      cancelPendingWeather()
    })
    map.on('move', orientWeatherMarkers)
    map.on('moveend', () => {
      mapIsMoving = false
      refresh()
    })
    map.on('zoomend', () => {
      gridStepNeedsUpdate = true
    })
  }

  document.getElementById('slider-time').addEventListener('input', e => {
    selectTimeIndex(parseInt(e.target.value, 10))
  })
  document.getElementById('btn-time-prev').addEventListener('click', () => selectTimeIndex(curTimeIdx - 1))
  document.getElementById('btn-time-next').addEventListener('click', () => selectTimeIndex(curTimeIdx + 1))
  document.getElementById('btn-time-play').addEventListener('click', toggleTimelinePlayback)

  document.getElementById('sel-source').addEventListener('change', () => {
    // Invalider tout de suite le batch en cours : sans cela, pendant les 350 ms de
    // debounce, ses callbacks passeraient encore le test de génération et
    // ré-ajouteraient des markers de l'ancien provider sur la carte vidée.
    refreshGen++
    if (abortCtrl) abortCtrl.abort()
    cancelProgressiveWeatherRender()
    showStatus(null)   // le batch aborté ne nettoiera pas son compteur de chargement
    updateDefaultBtn()
    if (!providerDialog.hidden) renderProviderInfo()
    // Rétablir tous les boutons — on ne connaît pas encore les champs du nouveau provider
    document.querySelectorAll('.layer-btn').forEach(btn => btn.style.display = '')
    // Vider markers et heatmap — les données sont provider-spécifiques
    clearHeatmap()
    clearWeatherMarkers()
    activeGrid = new Map()
    activeGridGeneration = refreshGen
    allTimes = []
    curTimeIdx = 0
    updateSliderUI()
    refresh()
  })

  document.getElementById('btn-set-default').addEventListener('click', () => {
    const id = document.getElementById('sel-source').value
    if (id) setDefaultProvider(id)
  })

  // discoverSources() déclenche le premier refresh() après avoir sélectionné le provider
  discoverSources()
})()
</script>
</body>
